<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/new_style.css">
    <link rel="icon" href="icons/logo.svg" type="image/x-icon">
    <title>new_audioplayer</title>
</head>
    
<body>
    <div class="wrapper">
        <div class="all-player">
            <div class="container">
                        <!-- ПАНЕЛЬ -->
                        <div class="panel">
                            <div class="logo"><img src="icons/logo.svg" alt=""></div>
                            <div class="panel-category">
                                <div class="but panel_btn active" data-tab="audioplayer"><img src="icons/audioplayer-icon.svg" alt=""></div>
                                <div class="but panel_btn" data-tab="playlist"><img src="icons/playlist-logo.svg" alt=""></div>
                                <div class="but panel_btn" data-tab="artists"><img src="icons/artists-icon.svg" alt=""></div>
                            </div>
                        </div>
                        <div class="player">
                            <!-- ГЛАВНАЯ (ПЛЕЕР) -->
                            <div class="music_player pane active" id="audioplayer">
                                    <div class="song_cover">
                                        <img class="song_img" width="250px" src="" alt="">
                                    </div>
                                    <div class="song_info">
                                        <div class="song_info__title"></div>
                                        <div class="list_of_artists"></div>
                                    </div>
                                    <div class="progress_box">
                                        <input class="progress" type="range">
                                    </div>
                                    <div class="song_time">
                                        <p class="current_time">00:00</p>
                                        <p class="song_duration">00:00</p>
                                    </div>
                                    <!-- КНОПОЧКИ -->
                                        <div class="audioplayer__player">
                                            <div class="song-control song_group">
                                                <img class="but repeat_song_button" src="icons/loop-button.svg" alt="">
                                                <img class="but mix_songs_button" src="icons/mix-button.svg" alt="">
                                            </div>
                                            <div class="song-change song_group">
                                                <img class="but prev_song_button" src="icons/prev-button.svg" alt="">
                                                <img class="but play_song_button" src="icons/play-button.svg" alt="">
                                                <img class="but next_song_button" src="icons/next-button.svg" alt="">
                                            </div>
                                            <div class="volume-control">
                                                <div class="change-volume-box"><input class="change-volume" min="0" max="1" step="0.01" value="1" type="range" name="" id=""></div>
                                                <div class="volume_button"><img class="but volume_play_button" src="icons/unmute-button.svg" alt=""></div>
                                            </div>

                                        </div>
                            </div>
                            <!-- ПЛЕЙЛИСТ -->
                            <div class="playlist pane" id="playlist">
                                <div class="zag">Мои треки</div>
                                <div class="tracklist"></div>
                            </div>
                            <!-- СПИСОК ИСПОЛНИТЕЛЕЙ -->
                            <div class="artists_list pane" id="artists">
                                <div class="zag">Исполнители</div>
                                <div class="artists"></div>
                            </div>
                            <!-- ИСПОЛНИТЕЛИ В ОТКРЫВАЮЩЕМСЯ ОКНЕ -->
                            <div class="artist-click">
                                <div class="artist-click-hat">
                                    <img class="but close-artist" src="icons/artists-info-close.svg" alt="">
                                    <div class="zag">Исполнители</div>
                                </div>
                                <div class="test-grid"></div>
                            </div>
                            <!-- ПРОФИЛЬ ИСПОЛНИТЕЛЯ -->
                            <div class="artist-profile new-pane" id="artist-profile">
                                <img class="but close-artist-profile" src="icons/close-artist-profile.svg" alt="">
                                <div class="artist-profile-hat">
                                    <img class="artist-profile-img" src="" width="100px" alt="">
                                    <div class="artist-profile-name"></div>
                                </div>
                                <div class="category-name">
                                    <div class="artist-profile-category-name checkSingles but">
                                        <p>Синглы</p>
                                        <img src="icons/see all.svg" alt="">
                                    </div>
                                </div>
                                <div class="singles-grid"></div>
                                <div class="category-name">
                                    <div class="artist-profile-category-name checkAlbums but">
                                        <p>Альбомы</p>
                                        <img src="icons/see all.svg" alt="">
                                    </div>
                                </div>
                                <div class="albums-grid"></div>
                            </div>
                            <div class="sloy new-pane"></div>
                            <!-- ОТКРЫТЫЙ АЛЬБОМ -->
                            <div class="alb new-pane">
                                <img class="but album-tracklist-close" src="icons/album-tracklist-close.svg" alt="">
                                    <div class="album-tracklist">
                                        <div class="album-tracklist-header">
                                            <img class="album-cover" src="" alt="">
                                            <div class="about-album">
                                                <div class="album-tracklist-title"></div>
                                                <div class="album-tracklist-artist"></div>
                                            </div>
                                        </div>
                                        <div class="album-separator"></div>
                                        <div class="album-tracklist-grid">
                                        </div>
                                    </div>
                            </div>
                            <!-- МЕНЮ ВСЕ СИНГЛЫ -->
                            <div class="all-single new-pane">
                                <div class="head">
                                    <img class="close-all-single but" src="icons/close-artist-profile.svg" alt="">
                                    <div class="zag">Синглы</div>
                                    <div class="all-single-artist-name"></div>
                                </div>
                                <div class="all-singles-grid-set">
                                    <div class="all-single-grid">
                                        <img class="all-single-grid-img" src="" alt="">
                                        <div class="all-single-grid-about">
                                            <div class="all-single-grid-title"></div>
                                            <div class="all-single-grid-artist"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- МЕНЮ ВСЕ АЛЬБОМЫ -->
                            <div class="all-album new-pane">
                                    <div class="head">
                                        <img class="close-all-album but" src="icons/close-artist-profile.svg" alt="">
                                        <div class="zag">Альбомы</div>
                                        <div class="all-album-artist-name"></div>
                                    </div>
                                    <div class="all-albums-grid-set">
                                        <div class="album">
                                            <img class="all-album-grid-img" src="images/CR0T0N, 444pluto, prvttyscrzz, 5GSWAG - HAD ENOUGH!.png" alt="">
                                            <div class="album-name">text</div>
                                        </div>
                                    </div>
                            </div>
                        </div>
            </div>
            <div class="mini-player">
                <div class="mini-player__hat">
                    <img class="mini-player-track_cover" src="" alt="">
                    <div class="bok">
                        <div class="mini-player-track-about">
                            <div class="mini-player-track-title"></div>
                            <div class="mini-player-track-artist"></div>
                        </div>
                        <input class="mini-player-progress-bar" type="range">
                        <div class="mini-player-song-time">
                            <div class="mini-player-track-current-time">00:00</div>
                            <div class="mini-player-track-duration">00:00</div>
                        </div>
                    </div>
                </div>
                <div class="mini-player__player">
                    <div class="song-control song_group">
                        <img class="but repeat_song_button" src="icons/loop-button.svg" alt="">
                        <img class="but mix_songs_button" src="icons/mix-button.svg" alt="">
                    </div>
                    <div class="song-change song_group">
                        <img class="but prev_song_button" src="icons/prev-button.svg" alt="">
                        <img class="but play_song_button" src="icons/play-button.svg" alt="">
                        <img class="but next_song_button" src="icons/next-button.svg" alt="">
                    </div>
                    <div class="volume-control">
                        <div class="change-volume-box"><input class="change-volume" min="0" max="1" step="0.01" value="1" type="range" name="" id=""></div>
                        <div class="volume_button"><img class="but volume_play_button" src="icons/unmute-button.svg" alt=""></div>                    
                    </div>
                </div>
            </div>
        </div>
        <div class="open-cover-back"></div>
        <div class="open-cover">
            <div class="close-open-cover"><img src="icons/maybe-new-close.svg" alt=""></div>
            <img class="open-cover-img" src="" alt="">
        </div>

    <script src="java_script/new_main.js"></script>
</body>
</html>
